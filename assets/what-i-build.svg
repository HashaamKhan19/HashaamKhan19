<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-labelledby="title desc">
<title id="title">What I build — Web, Mobile, Backend, Cloud</title>
<desc id="desc">A quiet animated pixel workbench with a web monitor, phone, servers and cloud. Blue and violet energy connects the four stations.</desc>
<style>
text {font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
.energy {animation:energy 4s ease-in-out infinite;}
.status {animation:status 4s steps(2,end) infinite;}
.status-late {animation:status 4s steps(2,end) -2s infinite;}
.cloud {animation:float 4s ease-in-out infinite;}
.flow {animation:flow 4s linear infinite;}
.flow2 {animation:flow 4s linear -2s infinite;}
@keyframes energy {0%,100% {opacity:.3} 50% {opacity:.75}}
@keyframes status {0%,100% {opacity:.4} 50% {opacity:1}}
@keyframes float {0%,100% {transform:translateY(0)} 50% {transform:translateY(-3px)}}
@keyframes flow {from {stroke-dashoffset:0} to {stroke-dashoffset:-100}}
@media (prefers-reduced-motion:reduce) {* {animation:none!important}}
</style>
