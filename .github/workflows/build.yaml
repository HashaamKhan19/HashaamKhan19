name: README build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: profile-readme-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update profile age
        run: python today.py

      - name: Commit and push profile update
        run: |
          git add -- dark_mode.svg
          if git diff --cached --quiet; then
            echo "Profile already up to date"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Update profile age"
          git pull --rebase origin main
          git push origin HEAD:main
